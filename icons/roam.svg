    <g transform="rotate(30 25.5 29)">
      <path d="M29.4 32.4 H36 L29.4 39 Z" fill="#A9C0AF" stroke="#A9C0AF" stroke-width="1.4"/>
      <path d="M-10 28.5 H60" stroke="#FFFDFA" stroke-width="7.6"/>
