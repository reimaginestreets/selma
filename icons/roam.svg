      <path d="M14 -10 V70 M27.5 -10 V70 M41 -10 V70 M-10 16 H60 M-10 41 H60 M22 47 L48 21" stroke="#FFFDFA" stroke-width="2.4"/>
    </g>
  </g>
  <rect x="9" y="12" width="33" height="34" rx="6" stroke="#5F7A6B" stroke-width="2"/>
</svg>
