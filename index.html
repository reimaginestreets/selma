<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Selma — slow journals</title>
  <meta name="description" content="Selma the Snail's slow journals: for mail, for time, for work and for books.">
  <meta name="theme-color" content="#F6F3EE">
  <link rel="icon" href="selma-home.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/home-180.png">
  <meta name="apple-mobile-web-app-title" content="Selma">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <header>
      <h1>Selma</h1>
      <p class="tagline">slow journals, one unhurried thing at a time</p>
      <img src="selma-home.svg" alt="Selma the Snail" width="96" height="96">
      <p class="greeting" id="greeting"></p>
    </header>

    <!-- Cards marked data-check show as "on its way" until that journal is published; app.js checks. -->
    <nav class="journals" aria-label="Journals">
      <a class="journal" href="../selma-work/" data-check="selma-work" title="A quiet place to open the day's work, note what it was, and close the book.">
        <img src="icons/work.svg" alt="" width="64" height="64">
        <div>
          <h2>Work</h2>
          <p>open the day, close the book</p>
        </div>
        <span class="arrow" aria-hidden="true">→</span>
      </a>
      <a class="journal" href="../selma-roam/" data-check="selma-roam" title="A nudge to get out while the light lasts, and a little map of where you went.">
        <img src="icons/roam.svg" alt="" width="64" height="64">
        <div>
          <h2>Roam</h2>
          <p>out while the light lasts</p>
        </div>
        <span class="arrow" aria-hidden="true">→</span>
      </a>
      <a class="journal" href="../selma-mail/" title="Postcards and letters sent, how long they took, and the addresses to send them to.">
        <img src="icons/mail.svg" alt="" width="64" height="64">
        <div>
          <h2>Mail</h2>
          <p>letters, postcards, addresses</p>
        </div>
        <span class="arrow" aria-hidden="true">→</span>
      </a>
      <a class="journal" href="../selma-time/" title="A quiet place to land when you have a little time and aren't sure what to do with it.">
        <img src="icons/time.svg" alt="" width="64" height="64">
        <div>
          <h2>Time</h2>
          <p>a place to land</p>
        </div>
        <span class="arrow" aria-hidden="true">→</span>
      </a>
      <a class="journal" href="../selma-read/" data-check="selma-read" title="A shelf of the books you've read, and what you want to remember from them.">
        <img src="icons/read.svg" alt="" width="64" height="64">
        <div>
          <h2>Read</h2>
          <p>a shelf, and what stayed</p>
        </div>
        <span class="arrow" aria-hidden="true">→</span>
      </a>
    </nav>
  </main>

  <script src="app.js"></script>
</body>
</html>
